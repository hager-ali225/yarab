on:
    push:
      branches: main
    pull_request:

jobs:
  validate-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: elkode
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
         python-version: '3.10'
      
      - name: Install Dependencies
        run: |
          pip install torch flake8
      
      - name: Linter Check
        run: flake8 .
      - name: Model Dry Test
        run: python -c "import torch; print('Model environment ready!')"
        
      - name: yalapdab
        uses: action/upload-artifact@v4
        with:
         name: error
         path: README.md
        
